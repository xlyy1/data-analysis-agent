name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # CI 永远不碰付费 Key：LLM 用确定性 mock
  LLM_PROVIDER: mock
  APP_ENV: ci
  DEEPSEEK_API_KEY: ""

jobs:
  # ---------------------------------------------------------------- 后端
  backend:
    name: 后端 测试 / 覆盖率 / 回归基线
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: 单元 / 接口测试 + 覆盖率门槛
        env:
          APP_ENV: test
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Agent 机制回归基线（离线，mock LLM）
        run: python bench/agent_baseline.py

      - name: 归档准确率门槛（不重跑付费评测）
        run: python bench/quality_gate.py

  # ---------------------------------------------------------------- 迁移
  migrations:
    name: 空库迁移 / 回滚可重放
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 空库 upgrade head
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci-migrate.db
        run: python -m alembic upgrade head

      - name: 校验关键表存在
        run: |
          python - <<'PY'
          import sqlite3
          required = {
              "users", "refresh_tokens", "datasources", "conversations", "messages",
              "background_tasks", "operation_logs", "reports",
              "analysis_schedules", "schedule_runs", "alembic_version",
          }
          with sqlite3.connect("ci-migrate.db") as conn:
              names = {row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - names
          assert not missing, f"缺表: {sorted(missing)}"
          print("tables ok:", len(names))
          PY

      - name: 模型与迁移是否同步（alembic check）
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci-migrate.db
        run: python -m alembic check

      - name: 回滚到底再升回来
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci-migrate.db
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  # ---------------------------------------------------------------- 前端
  frontend:
    name: 前端 构建 / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 生产构建（含 vue-tsc 类型检查）
        run: npm run build

  # ---------------------------------------------------------------- 端到端
  e2e:
    name: 端到端 UI 冒烟 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 后端起在同一个 step 里：跨 step 的后台进程可能被 runner 回收
      - name: 启动后端（mock LLM）并跑冒烟
        working-directory: frontend
        env:
          APP_ENV: dev
          LLM_PROVIDER: mock
          DATABASE_URL: sqlite+aiosqlite:///./ci-e2e.db
          AUTH_SECRET_KEY: ci-e2e-secret-key-0123456789
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: admin12345
          SAMPLE_SEED_ENABLED: "true"
          TASK_SERVICE_URL: http://127.0.0.1:9
          LOG_JSON: "true"
          VITE_API_PROXY: http://127.0.0.1:8000
        run: |
          set -e
          ( cd ../backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 & )
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then echo "api is up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz || { echo "backend failed to start"; tail -50 /tmp/api.log; exit 1; }
          npm run test:e2e

      - name: 失败时保留 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: 失败时打印后端日志
        if: failure()
        run: tail -100 /tmp/api.log || true

  # ---------------------------------------------------------------- 安全
  security:
    name: 安全扫描 (pip-audit / Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit 依赖漏洞
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r backend/requirements.txt --progress-spinner off --strict

      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: frontend/node_modules,frontend/dist,.git,release
          trivyignores: .trivyignore

  # ---------------------------------------------------------------- 容器
  docker:
    name: 容器镜像可构建 / compose 可解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose 配置校验
        run: docker compose config --quiet

      - name: 构建 api 镜像
        run: docker build -f backend/Dockerfile.api -t data-agent-api:ci .

      - name: 构建 worker 镜像
        run: docker build -f backend/Dockerfile.worker -t data-agent-worker:ci .

      - name: 构建 web 镜像
        run: docker build -f frontend/Dockerfile -t data-agent-web:ci .

      # 文件系统扫描只看依赖清单；基础镜像的系统包要扫镜像本身才看得见
      - name: 扫描运行镜像（OS 包 + 依赖）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: data-agent-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: 扫描 web 镜像
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: data-agent-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
