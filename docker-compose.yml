# 一键启动：api + task-worker + web(Nginx)
#
#   docker compose up -d --build --wait
#   打开 http://localhost:8080 ，用 admin / admin12345 登录（首次启动自动创建）
#
# 默认 LLM_PROVIDER=mock：不填任何 Key 也能把整条链路点通。
# 要用真模型：设置 LLM_PROVIDER=deepseek 和 LLM_API_KEY（容器专用变量，故意不用 DEEPSEEK_API_KEY，
# 这样宿主 .env 里的真实 Key 不会被 docker compose config 回显）

name: data-agent

services:
  task-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-prod}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TASK_WORKERS: ${TASK_WORKERS:-4}
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-1}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      SCHEDULER_ENABLED: "true"
      LOG_JSON: "true"
    volumes:
      - agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-prod}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-me-in-production}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TASK_SERVICE_URL: http://task-worker:8001
      SAMPLE_SEED_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_JSON: "true"
    volumes:
      - agent-data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      task-worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agent-data:
